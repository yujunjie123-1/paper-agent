schema_version: "1.0"
agents:
  - id: journal_scout
    role: 期刊调研员
    phase: venue
    objective: 只从期刊官网核验 scope、文章类型、篇幅、费用、数据政策和截止信息。
    skills: [venue-intelligence]
    tools: [web_search, browser, authenticated_browser, crossref]
    output_kind: venue_candidate
    max_steps: 8
  - id: conference_scout
    role: 会议调研员
    phase: venue
    objective: 从会议官网核验 track、征稿范围、匿名规则、页数、时间线和双投政策。
    skills: [venue-intelligence]
    tools: [web_search, browser, authenticated_browser]
    output_kind: venue_candidate
    max_steps: 8
  - id: competition_scout
    role: 科研比赛调研员
    phase: venue
    objective: 从主办方官网核验赛题、资格、数据许可、提交物、评分规则和截止时间。
    skills: [venue-intelligence]
    tools: [web_search, browser, authenticated_browser]
    output_kind: venue_candidate
    max_steps: 8
  - id: venue_adjudicator
    role: 投稿目标仲裁员
    phase: venue
    objective: 基于适配度、可行性、时间、成本和风险排序，不得补造候选信息。
    skills: [venue-intelligence]
    tools: []
    output_kind: venue_decision
    max_steps: 4
  - id: novelty_scout
    role: 创新性侦察员
    phase: topic
    objective: 搜索最近工作和相邻领域，寻找可被证伪的研究空白。
    skills: [evidence-ledger]
    tools: [web_search, openalex, crossref, arxiv]
    output_kind: topic_assessment
    max_steps: 10
  - id: feasibility_scout
    role: 可行性评估员
    phase: topic
    objective: 评估数据、算力、时间、伦理审批、基线和复现资源是否可获得。
    skills: [research-design]
    tools: [web_search, dataset_catalog, code_sandbox]
    output_kind: topic_assessment
    max_steps: 8
  - id: impact_scout
    role: 研究影响评估员
    phase: topic
    objective: 评估问题价值、目标读者、下游影响及与投稿目标的契合度。
    skills: [venue-intelligence, evidence-ledger]
    tools: [web_search]
    output_kind: topic_assessment
    max_steps: 6
  - id: topic_adjudicator
    role: 选题仲裁员
    phase: topic
    objective: 使用预注册权重综合创新性、可行性和影响，输出选题与淘汰理由。
    skills: [research-design]
    tools: []
    output_kind: topic_decision
    max_steps: 4
  - id: semantic_librarian
    role: 语义文献检索员
    phase: literature
    objective: 生成查询族、检索核心论文并记录数据库、查询式、日期和稳定标识符。
    skills: [evidence-ledger]
    tools: [openalex, crossref, arxiv, semantic_search, authenticated_browser]
    output_kind: evidence_set
    max_steps: 12
  - id: citation_graph_librarian
    role: 引文图谱检索员
    phase: literature
    objective: 从种子论文做前向/后向雪球扩展，区分原始研究、综述和预印本。
    skills: [evidence-ledger]
    tools: [openalex, crossref, authenticated_browser]
    output_kind: evidence_set
    max_steps: 12
  - id: prior_art_skeptic
    role: 现有工作反方检索员
    phase: literature
    objective: 主动寻找否定创新性、矛盾结论、负结果和失败复现的证据。
    skills: [evidence-ledger]
    tools: [web_search, openalex, crossref, arxiv, authenticated_browser]
    output_kind: evidence_set
    max_steps: 12
  - id: evidence_synthesizer
    role: 证据综合员
    phase: literature
    objective: 去重、分级、建立 claim-evidence 矩阵；无法核验的引用必须隔离。
    skills: [evidence-ledger]
    tools: [doi_resolver]
    output_kind: evidence_ledger
    max_steps: 10
  - id: research_designer
    role: 研究方案设计师
    phase: design
    objective: 把选题变成假设、变量、对照、基线、消融、统计功效、停止条件和风险清单。
    skills: [research-design]
    tools: [code_sandbox]
    output_kind: preregistered_protocol
    max_steps: 10
  - id: experiment_runner
    role: 实验执行员
    phase: experiment
    objective: 只执行已批准方案；保存环境、种子、配置、日志和原始输出，不改写失败结果。
    skills: [research-design]
    tools: [code_sandbox, artifact_store]
    output_kind: experiment_bundle
    max_steps: 16
  - id: statistician
    role: 统计审计员
    phase: experiment
    objective: 核验指标、样本量、置信区间、效应量、多重比较和稳健性分析。
    skills: [research-design]
    tools: [code_sandbox]
    output_kind: statistical_report
    max_steps: 10
  - id: reproducibility_engineer
    role: 复现工程师
    phase: experiment
    objective: 从干净环境复跑关键结论，核对数据谱系、依赖锁、随机种子和产物哈希。
    skills: [research-design]
    tools: [code_sandbox, artifact_store]
    output_kind: reproducibility_report
    max_steps: 12
  - id: figure_designer
    role: 科研图表设计师
    phase: writing
    objective: 用真实结果生成图表规划，确保图文 claim 对齐、色盲友好并记录数据来源。
    skills: [scientific-writing]
    tools: [code_sandbox, artifact_store]
    output_kind: figure_plan
    max_steps: 8
  - id: manuscript_writer
    role: 论文作者
    phase: writing
    objective: 依据投稿模板、证据台账和实验产物写作；禁止发明引用、数值或机制。
    skills: [scientific-writing]
    tools: [artifact_store, doi_resolver]
    output_kind: manuscript
    max_steps: 16
  - id: methodology_reviewer
    role: 方法学审稿人
    phase: review
    objective: 独立检查研究问题、设计、对照、消融、因果范围和方法披露。
    skills: [expert-review]
    tools: [artifact_store]
    output_kind: review_report
    max_steps: 8
  - id: statistics_reviewer
    role: 统计审稿人
    phase: review
    objective: 独立复核统计结论、效应量、不确定性、多重比较和图表一致性。
    skills: [expert-review]
    tools: [code_sandbox, artifact_store]
    output_kind: review_report
    max_steps: 8
  - id: novelty_reviewer
    role: 创新性审稿人
    phase: review
    objective: 用最新和相邻工作挑战 novelty claim，并标注可能遗漏的 prior art。
    skills: [expert-review, evidence-ledger]
    tools: [web_search, openalex, crossref]
    output_kind: review_report
    max_steps: 10
  - id: ethics_reviewer
    role: 伦理与完整性审稿人
    phase: review
    objective: 检查伦理审批、许可、隐私、双重用途、作者披露和图像/数据完整性风险。
    skills: [expert-review]
    tools: [artifact_store]
    output_kind: review_report
    max_steps: 8
  - id: reproducibility_reviewer
    role: 复现审稿人
    phase: review
    objective: 检查代码、数据、环境、随机性、报告完整性和独立复跑证据。
    skills: [expert-review]
    tools: [code_sandbox, artifact_store]
    output_kind: review_report
    max_steps: 10
  - id: venue_reviewer
    role: 投稿规范审稿人
    phase: review
    objective: 对照已存档的官方规则检查 scope、格式、匿名、页数、声明和附件。
    skills: [expert-review, venue-intelligence]
    tools: [browser, authenticated_browser, artifact_store]
    output_kind: review_report
    max_steps: 8
  - id: review_adjudicator
    role: 审稿意见仲裁员
    phase: review
    objective: 合并重复问题、处理冲突、按证据和风险排序；不以简单多数票代替判断。
    skills: [expert-review]
    tools: []
    output_kind: review_decision
    max_steps: 8
  - id: revision_planner
    role: 修订规划员
    phase: revision
    objective: 把每条有效意见映射到修改、补实验、解释或有证据的异议，并建立追踪矩阵。
    skills: [revision-rebuttal]
    tools: [artifact_store]
    output_kind: revision_plan
    max_steps: 8
  - id: manuscript_reviser
    role: 修稿执行员
    phase: revision
    objective: 按批准的追踪矩阵修改稿件，保留变更定位、前后证据和未解决项。
    skills: [revision-rebuttal, scientific-writing]
    tools: [artifact_store, code_sandbox]
    output_kind: revised_manuscript
    max_steps: 14
  - id: rebuttal_writer
    role: 审稿回复作者
    phase: revision
    objective: 逐条引用原意见，礼貌、具体、可核验地说明修改位置或不同意的依据。
    skills: [revision-rebuttal]
    tools: [artifact_store]
    output_kind: rebuttal
    max_steps: 10
  - id: submission_packager
    role: 投稿包管理员
    phase: submission
    objective: 生成清单、稿件、补充材料、数据代码声明、cover letter 和哈希清单；不自动点击提交。
    skills: [venue-intelligence, revision-rebuttal]
    tools: [artifact_store]
    output_kind: submission_package
    max_steps: 8
  - id: portal_operator
    role: 投稿门户执行员
    phase: submission
    objective: 在 submission 人工批准后复用受控登录会话填写表单、上传已批准哈希的文件、验证并提交；验证码、支付、条款变化或权限异常立即转人工。
    skills: [authenticated-browser-ops, venue-intelligence]
    tools: [authenticated_browser, artifact_store]
    output_kind: submission_receipt
    max_steps: 12
