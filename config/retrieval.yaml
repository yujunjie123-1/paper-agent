schema_version: "2.0"
pipeline:
  acl_filter_before_context: true
  channels: [bm25, dense]
  fusion:
    algorithm: reciprocal_rank_fusion
    rank_constant: 60
  rerank:
    mode: conditional
    conditions: [ambiguous_query, candidate_count_above_threshold, high_risk_review]
  unsupported_claim_policy: refuse_or_mark
  conflict_policy: quarantine_for_review
storage:
  local: in_memory_protocol_test_double
  production: postgres_pgvector
  dedicated_vector_db_trigger: measured_scale_or_latency_slo_failure
