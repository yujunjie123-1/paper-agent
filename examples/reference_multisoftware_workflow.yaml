- id: reference_2_cswf_attention_unet_multisoftware
  title: Reference 2 CSWF Attention U-Net Replica Workflow
  objective: Use Draw.io for the dense block topology, TikZ for the attention-gate
    inset, PlotNeuralNet for small 3D feature blocks, and Draw.io master assembly
    for routed red/blue/black connections.
  planning:
    strategy: 'Separate 2D topology from specialist assets: the dense network body
      and connectors are Draw.io tasks; only the inset and 3D module language are
      generated upstream.'
    components:
    - id: ref2_reference_trace
      name: locked reference underlay
      description: Original image used only as a locked Draw.io tracing underlay when
        provided.
      features:
      - reference
      - trace
      - drawio
    - id: ref2_legend
      name: legend box and icons
      description: Editable 2D legend, icon keys, Chinese labels, dropout squares,
        and connector samples.
      features:
      - drawio
      - legend
      - labels
      - 2d
    - id: ref2_main_unet_topology
      name: main CSWF attention U-Net topology
      description: Flat encoder-decoder blocks, feature stacks, dropout markers, concat
        bars, and U-shape topology.
      features:
      - drawio
      - 2d
      - topology
      - architecture
      - block
    - id: ref2_routed_arrows
      name: red, blue, black, and cyan routed arrows
      description: Final connector routing, arrowheads, line jumps, and crossing cleanup
        must be done in Draw.io.
      features:
      - drawio
      - connectors
      - routing
      - arrow
      - line jumps
    - id: ref2_attention_gate_inset
      name: attention-gate inset
      kind: tikz_attention_gate
      description: Math-like labels and crisp local module inset generated as a vector
        component.
    - id: ref2_cswf_3d_block_language
      name: small 3D CSWF feature blocks
      description: Perspective cube/feature-map language inside CSWF modules.
      features:
      - 3d
      - feature map
      - stack
      - plotneuralnet
    - id: ref2_flow_skeleton
      name: information-flow skeleton
      kind: graphviz_graph
      description: Optional auto-layout dependency skeleton used only for planning
        and checking route direction.
    - id: ref2_master_canvas
      name: final Draw.io assembly
      description: Import specialist assets, then build editable topology, align all
        labels, route connectors, and export final files.
      features:
      - drawio
      - master
      - assembly
      - final export
  workflow:
  - 'Stage 1: TikZ creates the attention gate inset with math-style labels.'
  - 'Stage 2: PlotNeuralNet creates the 3D CSWF feature-map language used inside modules.'
  - 'Stage 3: Graphviz records the information-flow skeleton.'
  - 'Stage 4: Draw.io master assembly imports the inset/assets, then owns orthogonal
    routing, legend, and final layout.'
  stages:
  - id: ref2_attention_gate_tikz
    tool: TikZ
    role: attention gate local inset
    figure:
      id: ref2_attention_gate_tikz
      kind: tikz_attention_gate
      title: ''
  - id: ref2_cswf_plotneuralnet_asset
    tool: PlotNeuralNet
    role: 3D feature blocks inside CSWF modules
    figure:
      id: ref2_cswf_plotneuralnet_asset
      kind: plotneuralnet_cnn
      title: CSWF 3D block asset
      layers:
      - type: input
        name: N
        shape: H x W x C
      - type: conv
        name: Conv
        shape: H x W x N
      - type: conv
        name: Fuse
        shape: H x W x C
  - id: ref2_flow_graph
    tool: Graphviz
    role: encoder-decoder information-flow skeleton
    figure:
      id: ref2_flow_graph
      kind: graphviz_graph
      title: CSWF Attention U-Net flow skeleton
      nodes:
      - id: input
        label: Input
        rank: 0
      - id: enc
        label: Encoder
        rank: 1
      - id: cswf
        label: CSWF
        rank: 2
      - id: gate
        label: Gate
        rank: 3
      - id: dec
        label: Decoder
        rank: 4
      - id: out
        label: Output
        rank: 5
      edges:
      - - input
        - enc
      - - enc
        - cswf
      - - cswf
        - gate
      - - gate
        - dec
      - - dec
        - out
      - - enc
        - gate
  assembly:
    id: reference_2_cswf_attention_unet_master
    title: ''
    canvas:
      width: 1400
      height: 980
    notes: Draw.io master owns the dense topology and routed links. TikZ attention
      inset is imported as a staged asset.
    placements:
    - asset: ref2_attention_gate_tikz
      x: 660
