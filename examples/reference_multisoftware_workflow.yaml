project: reference_multisoftware_replica_workflow
description: 'Staged workflow: specialist tools create assets, then Draw.io master
  assembly controls layout, routing, labels, and final export.'
workflows:
- id: reference_1_unet_3d_multisoftware
  title: Reference 1 U-Net 3D Replica Workflow
  objective: Use PlotNeuralNet for 3D convolutional feature-map language, Graphviz
    for dependency skeleton, and Draw.io master assembly for skip routes and final
    paper-style layout.
  planning:
    strategy: 'Classify the figure before rendering: 3D feature slabs are specialist
      assets; skip routes, labels, and final alignment stay in Draw.io.'
    components:
    - id: ref1_reference_trace
      name: locked reference underlay
      description: Original image used only as a locked Draw.io tracing underlay when
        provided.
      features:
      - reference
      - trace
      - drawio
    - id: ref1_encoder_decoder_3d_slabs
      name: thin 3D encoder-decoder feature slabs
      description: Flat perspective convolution and deconvolution feature-map stacks,
        including K, 64, 128, 256, and 512 labels.
      features:
      - 3d
      - feature map
      - stack
      - conv
      - plotneuralnet
    - id: ref1_skip_connection_skeleton
      name: encoder-decoder dependency skeleton
      kind: graphviz_graph
      description: Optional dependency skeleton for skip routes before the Draw.io
        connector pass.
    - id: ref1_long_skip_routes
      name: long teal skip routes and arrow directions
      description: Connector-heavy long routes with clear arrow direction, no broken
        line segments, and final line-jump cleanup.
      features:
      - drawio
      - connectors
      - routing
      - arrow
      - line jumps
    - id: ref1_dimension_labels
      name: dimension labels and output caption
      description: Small K, 1/2, 1/4, 1/8, 1/16 and concatenation labels that need
        final manual alignment in Draw.io.
      features:
      - drawio
      - labels
      - 2d
    - id: ref1_master_canvas
      name: final Draw.io assembly
      description: Import generated 3D assets, then assemble, align, route, and export
        from Draw.io.
      features:
      - drawio
      - master
      - assembly
      - final export
  workflow:
  - 'Stage 1: PlotNeuralNet creates a controlled 3D CNN backbone asset.'
  - 'Stage 2: Graphviz records the encoder-decoder dependency skeleton.'
  - 'Stage 3: Draw.io master assembly imports assets, then owns long skip routes,
    labels, and final composition.'
  stages:
  - id: ref1_plotneuralnet_backbone
    tool: PlotNeuralNet
    role: 3D encoder/decoder block style source
    figure:
      id: ref1_plotneuralnet_backbone
      kind: plotneuralnet_cnn
      title: 3D U-Net block language
      layers:
      - type: input
        name: Input
        shape: K
      - type: conv
        name: '64'
        shape: 64x64x64
      - type: pool
        name: Pool
        shape: 1/2
      - type: conv
        name: '128'
        shape: 32x32x128
      - type: pool
        name: Pool
        shape: 1/4
      - type: conv
        name: '256'
        shape: 16x16x256
      - type: pool
        name: Pool
        shape: 1/8
      - type: conv
        name: '512'
        shape: 8x8x512
      - type: conv
        name: Concat
        shape: K
  - id: ref1_dependency_graph
    tool: Graphviz
    role: layout skeleton for skip-connection dependencies
    figure:
      id: ref1_dependency_graph
      kind: graphviz_graph
      title: U-Net skip dependency skeleton
      nodes:
      - id: in
        label: K
        rank: 0
      - id: e1
        label: '64'
        rank: 1
      - id: e2
        label: '128'
        rank: 2
      - id: e3
        label: '256'
        rank: 3
      - id: b
        label: '512'
        rank: 4
      - id: d3
        label: 1/8
        rank: 3
      - id: d2
        label: 1/4
        rank: 2
      - id: d1
        label: 1/2
        rank: 1
      - id: out
        label: K
        rank: 0
      edges:
      - - in
        - e1
      - - e1
        - e2
      - - e2
        - e3
      - - e3
        - b
      - - b
        - d3
      - - d3
        - d2
      - - d2
        - d1
      - - d1
        - out
      - - e1
        - d1
      - - e2
        - d2
      - - e3
        - d3
  assembly:
    id: reference_1_unet_3d_master
    title: ''
    canvas:
      width: 1600
