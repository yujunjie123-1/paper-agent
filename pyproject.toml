[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "paper-agent"
version = "0.3.0"
description = "Durable, review-driven multi-agent workflow for the research paper lifecycle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "httpx>=0.28.1,<0.29",
  "langgraph>=1.2.11,<1.3",
  "openai>=3.2.0,<4",
  "pydantic>=2.13.4,<3",
  "PyYAML>=6.0.3,<7",
  "uvicorn[standard]>=0.51.0,<0.52",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1,<10", "pytest-asyncio>=1.3.0,<2"]
production = [
  "opentelemetry-api>=1.44.0,<2",
  "opentelemetry-sdk>=1.44.0,<2",
]

[project.scripts]
paper-agents = "paper_agents.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_agents"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
